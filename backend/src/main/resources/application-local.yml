spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vozly}
    username: ${DB_USERNAME:vozly}
    password: ${DB_PASSWORD:vozly}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    create-schemas: true
    schemas: vozly
    default-schema: vozly
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: INFO
