spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vozly}
    username: ${DB_USERNAME:vozly}
    password: ${DB_PASSWORD:vozly}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    create-schemas: true
    schemas: vozly
    default-schema: vozly
    locations: classpath:db/migration

vozly:
  security:
    jwt:
      secret: ${VOZLY_JWT_SECRET:local-only-change-this-secret-to-at-least-32-bytes}
    cookies:
      secure: ${COOKIE_SECURE:false}

  security:
    oauth2:
      client:
        registration:
          microsoft:
            client-id: ${MICROSOFT_CLIENT_ID:local-not-configured}
            client-secret: ${MICROSOFT_CLIENT_SECRET:local-not-configured}
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:organizations}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:organizations}/oauth2/v2.0/token

logging:
  level:
    org.flywaydb: INFO
