spring:
  application:
    name: vozly-backend
  security:
    oauth2:
      client:
        registration:
          microsoft:
            provider: microsoft
            client-id: ${MICROSOFT_CLIENT_ID}
            client-secret: ${MICROSOFT_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID:organizations}/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

server:
  port: ${PORT:8080}
  shutdown: graceful

vozly:
  security:
    jwt:
      secret: ${VOZLY_JWT_SECRET}
      issuer: ${VOZLY_JWT_ISSUER:https://api.vozly.local}
      audience: ${VOZLY_JWT_AUDIENCE:vozly-api}
    cookies:
      secure: ${COOKIE_SECURE:true}
    cors:
      allowed-origin: ${FRONTEND_URL:http://localhost:4200}
    frontend-url: ${FRONTEND_URL:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: Vozly Backend
    description: API da solução de agentes de voz inteligentes
