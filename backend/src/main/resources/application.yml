spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  application:
    name: vozly-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    create-schemas: true
    schemas: vozly
    default-schema: vozly
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false
    out-of-order: false
    clean-disabled: true
  security:
    oauth2:
      client:
        registration:
          microsoft:
            provider: microsoft
            client-id: ${MICROSOFT_CLIENT_ID}
            client-secret: ${MICROSOFT_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email
        provider:
          microsoft:
            authorization-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/${MICROSOFT_TENANT_ID}/oauth2/v2.0/token
            jwk-set-uri: https://login.microsoftonline.com/common/discovery/v2.0/keys
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: sub

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  port: ${PORT:8080}
  shutdown: graceful

vozly:
  security:
    jwt:
      secret: ${VOZLY_JWT_SECRET}
      issuer: ${VOZLY_JWT_ISSUER}
      audience: ${VOZLY_JWT_AUDIENCE:vozly-api}
    cookies:
      secure: ${COOKIE_SECURE:true}
    cors:
      allowed-origin: ${FRONTEND_URL}
    frontend-url: ${FRONTEND_URL}
    password-reset:
      from: ${PASSWORD_RESET_FROM:nao-responda@vozly.com}
    rate-limit:
      password-reset:
        max-attempts: ${RATE_LIMIT_PASSWORD_RESET_MAX:5}
        window-seconds: ${RATE_LIMIT_PASSWORD_RESET_WINDOW:3600}
      login:
        max-attempts: ${RATE_LIMIT_LOGIN_MAX:10}
        window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:900}
      registration:
        max-attempts: ${RATE_LIMIT_REGISTER_MAX:5}
        window-seconds: ${RATE_LIMIT_REGISTER_WINDOW:3600}
      interest:
        max-attempts: ${RATE_LIMIT_INTEREST_MAX:5}
        window-seconds: ${RATE_LIMIT_INTEREST_WINDOW:3600}
      refresh:
        max-attempts: ${RATE_LIMIT_REFRESH_MAX:30}
        window-seconds: ${RATE_LIMIT_REFRESH_WINDOW:900}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

info:
  app:
    name: Vozly Backend
    description: API da solução de agentes de voz inteligentes