services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      PORT: "8080"
      FRONTEND_URL: http://localhost:4200
      COOKIE_SECURE: "false"
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    environment:
      PORT: "10000"
      API_UPSTREAM: backend:8080
    ports:
      - "4200:10000"
    restart: unless-stopped
