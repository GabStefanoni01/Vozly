<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 562" width="1000" height="562">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080C" />
      <stop offset="50%" stop-color="#0D0C15" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Ambient Purple Glow -->
    <radialGradient id="ambientPurple" cx="80%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#6D00FF" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#1E0B3B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(168, 85, 247, 0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="562" fill="url(#bgGrad)" />
  <rect width="1000" height="562" fill="url(#ambientPurple)" />
  <rect width="1000" height="562" fill="url(#grid)" />

  <!-- Technical Circuit Accent Lines -->
  <path d="M 0 100 L 220 100 L 280 160 L 720 160 L 780 100 L 1000 100" fill="none" stroke="rgba(109, 0, 255, 0.22)" stroke-width="1.5" />
  <path d="M 0 460 L 300 460 L 360 400 L 800 400 L 850 460 L 1000 460" fill="none" stroke="rgba(168, 85, 247, 0.16)" stroke-width="1.5" />

  <!-- Graphic Payload -->
  
      <defs>
        <linearGradient id="gradFlow" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#6D00FF" />
          <stop offset="50%" stop-color="#A855F7" />
          <stop offset="100%" stop-color="#C084FC" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="6" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>
      <!-- Pipeline Blocks -->
      <g transform="translate(180, 210)">
        <!-- Node 1: Audio STT -->
        <rect x="0" y="0" width="160" height="90" rx="14" fill="#15151E" stroke="#6D00FF" stroke-width="2" />
        <text x="80" y="40" fill="#A855F7" font-family="system-ui" font-weight="700" font-size="14" text-anchor="middle">STREAMING STT</text>
        <text x="80" y="65" fill="#71717A" font-family="system-ui" font-size="11" text-anchor="middle">&lt; 95ms latency</text>
        
        <!-- Connector 1 -->
        <line x1="160" y1="45" x2="230" y2="45" stroke="url(#gradFlow)" stroke-width="3" filter="url(#glow)" />
        <polygon points="230,45 220,40 220,50" fill="#A855F7" />

        <!-- Node 2: LLM Core -->
        <rect x="230" y="-15" width="180" height="120" rx="18" fill="#1C182B" stroke="#A855F7" stroke-width="2.5" filter="url(#glow)" />
        <text x="320" y="35" fill="#FFFFFF" font-family="system-ui" font-weight="800" font-size="15" text-anchor="middle">RECEPTOR LLM</text>
        <text x="320" y="60" fill="#C084FC" font-family="system-ui" font-weight="600" font-size="11" text-anchor="middle">Speculative Engine</text>
        <text x="320" y="82" fill="#71717A" font-family="system-ui" font-size="10" text-anchor="middle">Streaming Chunking</text>

        <!-- Connector 2 -->
        <line x1="410" y1="45" x2="480" y2="45" stroke="url(#gradFlow)" stroke-width="3" filter="url(#glow)" />
        <polygon points="480,45 470,40 470,50" fill="#A855F7" />

        <!-- Node 3: Neural TTS -->
        <rect x="480" y="0" width="160" height="90" rx="14" fill="#15151E" stroke="#6D00FF" stroke-width="2" />
        <text x="560" y="40" fill="#A855F7" font-family="system-ui" font-weight="700" font-size="14" text-anchor="middle">NEURAL TTS</text>
        <text x="560" y="65" fill="#71717A" font-family="system-ui" font-size="11" text-anchor="middle">Sub-500ms Audio</text>
      </g>
    

  <!-- Header Badge & Branding -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="90" height="26" rx="6" fill="#1B122E" stroke="#6D00FF" stroke-width="1" />
    <text x="45" y="17" fill="#C084FC" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" text-anchor="middle" letter-spacing="1">VOZLY</text>
    
    <text x="105" y="17" fill="#A1A1AA" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="12">CATEGORIA EDITORIAL</text>
  </g>

  <!-- Title & Subtitle Card Overlay -->
  <g transform="translate(60, 430)">
    <rect x="0" y="0" width="880" height="85" rx="14" fill="rgba(13, 12, 19, 0.85)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1" />
    <text x="30" y="38" fill="#FFFFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="19">Engenharia & Inteligência Artificial</text>
    <text x="30" y="64" fill="#A1A1AA" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="13">Pipelines neurais de voz, inferência concorrente e baixa latência.</text>
  </g>
</svg>