name: Flyway and authentication validation

on:
  pull_request:
    branches: [develop]
    paths:
      - "backend/**"
      - ".github/workflows/flyway-auth-validation.yml"
  push:
    paths:
      - "backend/**"
      - ".github/workflows/flyway-auth-validation.yml"

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend tests with PostgreSQL migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml clean verify
