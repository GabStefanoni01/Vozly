name: Vozly CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vozly-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Maven verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:h2:mem:vozly_ci
      DB_USERNAME: sa
      DB_PASSWORD: ""
      MICROSOFT_TENANT_ID: organizations
      MICROSOFT_CLIENT_ID: ci-placeholder
      MICROSOFT_CLIENT_SECRET: ci-placeholder
      VOZLY_JWT_SECRET: ci-only-secret-not-used-outside-tests-0123456789
      VOZLY_JWT_ISSUER: https://ci.vozly.invalid
      FRONTEND_URL: http://localhost:4200
      COOKIE_SECURE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run backend verification
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload backend artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: vozly-backend-${{ github.sha }}
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend / Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@11.17.0

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build Angular application
        run: npm run build

      - name: Upload frontend artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: vozly-frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14
